    return { locations: [], reviews: [], error: (locRes.error || revRes.error).message };
  }
  const locations = (locRes.data || []).map((row) => ({ id: row.id, ...row.data }));
  const reviews = (revRes.data || []).map((row) => ({ id: row.id, locationId: row.location_id, ...row.data }));
  return { locations, reviews, error: null };

async function insertLocation(loc) {
  const { id, ...rest } = loc;
  const { error } = await db.from("locations").insert({ id, data: rest });
  return !error;
}

async function insertReview(rev) {
  const { id, locationId, ...rest } = rev;
  const { error } = await db.from("reviews").insert({ id, location_id: locationId, data: rest });
  return !error;
}

  const { error } = await db.from("locations").update({ data: merged }).eq("id", id);
  return !error;
}
